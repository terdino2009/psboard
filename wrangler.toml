name = "psboard-workers"
type = "service"
main = "src/index.ts"
compatibility_date = "2024-12-16"

# Route
routes = [
  { pattern = "psboard-api.skpd.workers.dev/*", zone_name = "skpd.workers.dev" }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "psboard"
database_id = "your-db-id-here"  # Буде автоматично заповнено після створення

# Durable Objects
[[durable_objects.bindings]]
name = "COLLABORATION"
class_name = "CollaborationDurableObject"
script_name = "psboard-workers"

# Vars (environment variables)
[env.development]
vars = { ENVIRONMENT = "development" }

[env.production]
vars = { ENVIRONMENT = "production" }

# Analytics
[analytics]
enabled = true
