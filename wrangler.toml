name = "psboard-collab"
type = "service"
main = "src/index.ts"
compatibility_date = "2024-12-16"

[[d1_databases]]
binding = "DB"
database_name = "psboard-collab"
database_id = "YOUR_DB_ID_HERE"

[[durable_objects.bindings]]
name = "COLLABORATION"
class_name = "CollaborationDurableObject"
script_name = "psboard-collab"

[env.development]
vars = {
  ENVIRONMENT = "development",
  JWT_SECRET = "dev-secret-key-change-in-production"
}

[env.production]
vars = {
  ENVIRONMENT = "production",
  JWT_SECRET = "prod-secret-key-change-in-production"
}

[analytics]
enabled = true
